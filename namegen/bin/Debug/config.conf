# --- GeneSim Global Configuration ---

# Maa-asetus (Vaikuttaa siihen, mitä lohkoa social_logic.jsonista luetaan)
# Jos locale=FI, valitse region id regions.jsonista (esim. helsinki, it_suomi, lappi)
locale=FI
country=Finland

# Viittaus master-karttaan
master_config=namegen_master_config.json

# Simulaation lähtöarvot
default_region=yleinen_suomi
year=1880

# Generoinnin määrä ja muoto
count=50
output_format=text
output_file=output.txt

# Tekniset kytkimet
verbose=1
use_historical_logic=1
deterministic_seed=0