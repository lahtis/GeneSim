# --- GeneSim NameGen Configuration ---

# Master Configuration
data_locale=fi-FI
master_config=namegen_master_config.json

# Simulation initial values
default_region=yleinen_suomi
year=1860

# Amount and form of generation
count=1
output_format=plain
output_file=

# Technical switches
# Use CSV weights: 1 = historical popularity, 0 = Uniform distribution (all names equally common)
use_weights=1
log=1
verbose=1
